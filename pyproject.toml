[project]
name = "foxygpu"
version = "0.2.1"
description = "Run local code on Google Colab's free GPU"
readme = "PYPI_README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Shamshad Choudhary", email = "chaudhary.s.shamshad07@gmail.com" }
]
keywords = ["colab", "gpu", "ollama", "deployment", "cli", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
]
dependencies = [
  "typer>=0.9",
  "requests>=2.31",
  "websockets>=12.0",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed to run the test suite locally — agent_source.py is never
# imported by the end-user CLI, only read as text and shipped to Colab, so
# these stay out of the core install.
dev = [
  "pytest>=7.4",
  "pytest-timeout>=2.2",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "python-multipart>=0.0.6",
]

[project.urls]
Homepage = "https://github.com/Shamshadz/FoxyGPU"
Repository = "https://github.com/Shamshadz/FoxyGPU"
Issues = "https://github.com/Shamshadz/FoxyGPU/issues"

[project.scripts]
foxygpu = "foxygpu.main:app"

[tool.setuptools.packages.find]
include = ["foxygpu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"
