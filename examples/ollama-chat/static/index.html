<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FoxyGPU Chat</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }
  h1 { font-size: 1.1rem; opacity: 0.7; margin: 0 0 0.75rem; }
  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding-bottom: 1rem;
  }
  .msg { padding: 0.6rem 0.9rem; border-radius: 0.6rem; white-space: pre-wrap; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: #2563eb; color: white; }
  .msg.assistant { align-self: flex-start; background: rgba(127,127,127,0.15); }
  form { display: flex; gap: 0.5rem; }
  input {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid rgba(127,127,127,0.4);
    font-size: 1rem;
  }
  button {
    padding: 0.6rem 1.1rem;
    border-radius: 0.5rem;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 0.8rem; opacity: 0.6; margin-bottom: 0.5rem; }
</style>
</head>
<body>
  <h1>FoxyGPU Chat — running on Colab GPU via Ollama</h1>
  <div id="status">checking model...</div>
  <div id="messages"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Say something..." />
    <button id="send" type="submit">Send</button>
  </form>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

let history = [];

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

fetch("/api/health").then(r => r.json()).then(data => {
  statusEl.textContent = data.ollama
    ? `Connected to Ollama (model: ${data.model})`
    : `Ollama not reachable yet (model: ${data.model}) — it may still be starting`;
}).catch(() => { statusEl.textContent = "Could not reach backend"; });

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendBtn.disabled = true;

  addMessage("user", text);
  history.push({ role: "user", content: text });

  const assistantEl = addMessage("assistant", "");
  let assistantText = "";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const data = JSON.parse(line);
        if (data.error) {
          assistantText += `[error: ${data.error}]`;
        } else if (data.message && data.message.content) {
          assistantText += data.message.content;
        }
        assistantEl.textContent = assistantText;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }
  } catch (err) {
    assistantEl.textContent = "[request failed: " + err + "]";
  }

  history.push({ role: "assistant", content: assistantText });
  sendBtn.disabled = false;
  input.focus();
});
</script>
</body>
</html>
